version: '3.9'

services:
  primary: &replica
    image: redis:7-alpine
    healthcheck:
      test: redis-cli --raw incr ping
    volumes:
      - redis-data:/data
    secrets:
      - redis-password
    entrypoint: sh -c
    command:
      - |
        redis-server
        --requirepass `cat /run/secrets/redis-password` 
        --masterauth `cat /run/secrets/redis-password`
        --appendonly yes
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-1

  replica_1:
    <<: *replica
    command: &replica-command
      - |
        redis-server
        --replicaof primary 6379
        --requirepass `cat /run/secrets/redis-password` 
        --masterauth `cat /run/secrets/redis-password`
        --appendonly yes
    deploy:
      placement:
        constraints:
          - node.hostname==manager-2

  replica_2:
    <<: *replica
    command: *replica-command
    deploy:
      placement:
        constraints:
          - node.hostname==manager-3

  sentinel_1: &sentinel
    image: redis:7-alpine
    healthcheck:
      test: redis-cli -p 26379 --raw incr ping
    configs:
      - sentinel.conf
    secrets:
      - redis-password
    entrypoint: sh -c
    command:
      - |
        REDIS_PASSWORD=`cat /run/secrets/redis-password`
        cp /sentinel.conf /redis-sentinel.conf
        echo "sentinel auth-pass mymaster $$REDIS_PASSWORD" >> /redis-sentinel.conf
        redis-sentinel /redis-sentinel.conf
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-1

  sentinel_2:
    <<: *sentinel
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-2

  sentinel_3:
    <<: *sentinel
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-3

volumes:
  redis-data:

configs:
  sentinel.conf:
    file: configs/redis-sentinel.conf

secrets:
  redis-password:
    external: true
