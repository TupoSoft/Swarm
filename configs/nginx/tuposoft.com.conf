server {
    listen 443 ssl;
    server_name www.tuposoft.com;

    ssl_certificate /run/secrets/tuposoft.com.cert.pem;
    ssl_certificate_key /run/secrets/tuposoft.com.key.pem;

    return 301 https://tuposoft.com$request_uri;
}

server {
    listen 443 ssl;
    server_name tuposoft.com;

    ssl_certificate /run/secrets/tuposoft.com.cert.pem;
    ssl_certificate_key /run/secrets/tuposoft.com.key.pem;

    location / {
        proxy_pass http://tuposoftcom_site:3000;
    }
}
