server {
    listen 443 ssl;
    server_name p0.leademailfinder.com api.leademailfinder.com;

    ssl_certificate /run/secrets/p1.leademailfinder.com.cert.pem;
    ssl_certificate_key /run/secrets/p1.leademailfinder.com.key.pem;

    location / {
        proxy_pass http://email_finder:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
