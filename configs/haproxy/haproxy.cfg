global
    daemon
    maxconn 2048

    resolvers docker
        nameserver dns1 127.0.0.11:53
        resolve_retries 3
        timeout resolve 1s
        timeout retry 1s
        hold valid 10s
        hold nx 5s
        hold other 5s
        hold refused 5s
        hold timeout 5s
        hold obsolete 5s

defaults
    mode tcp
    log global
    option tcp-check
    option tcplog
    option log-health-checks
    retry-on all-retryable-errors
    retries 2

    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 2s

    option clitcpka
    option srvtcpka

frontend patroni_write
    bind *:5432
    default_backend patroni_bk_write

frontend patroni_read
    bind *:5433
    default_backend patroni_bk_read

backend patroni_bk_write
    option httpchk GET /master
    http-check expect status 200
    default-server inter 1s fall 2 rise 3 on-marked-down shutdown-sessions resolvers docker init-addr none
    server patroni_1 patroni_patroni_1:5432 check port 8008
    server patroni_2 patroni_patroni_2:5432 check port 8008
    server patroni_3 patroni_patroni_3:5432 check port 8008

backend patroni_bk_read
    option httpchk GET /replica
    http-check expect status 200
    balance leastconn
    default-server inter 1s fall 2 rise 3 on-marked-down shutdown-sessions resolvers docker init-addr none
    server patroni_1 patroni_patroni_1:5432 check port 8008
    server patroni_2 patroni_patroni_2:5432 check port 8008
    server patroni_3 patroni_patroni_3:5432 check port 8008

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
