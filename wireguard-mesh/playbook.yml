- name: Build full mesh Wireguard
  hosts: all
  become: yes

  tasks:
    - name: Install WireGuard
      apt:
        name: wireguard
        state: present
      tags: install

    - name: Create WireGuard directory
      file:
        path: "{{ wg_path }}"
        state: directory
        mode: 0700

    - name: Generate private key if missing
      command: wg genkey
      register: keygen
      args:
        creates: "{{ wg_path }}/privatekey"
      notify: restart_wg
      changed_when: keygen.stdout != ""

    - name: Save private key
      copy:
        content: "{{ keygen.stdout }}"
        dest: "{{ wg_path }}/privatekey"
        mode: 0600
      when: keygen.stdout != ""

    - name: Read private key
      slurp:
        src: "{{ wg_path }}/privatekey"
      register: privatekey_raw

    - set_fact:
        key_value:
          private_key: "{{ privatekey_raw.content | b64decode }}"

    - name: Generate public key
      command: wg pubkey
      register: pubkey
      args:
        stdin: "{{ private_key }}"
      changed_when: false

    - set_fact:
        key_value:
          public_key: "{{ pubkey.stdout }}"

  handlers:
    - name: restart_wg
      systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted
        enabled: yes
