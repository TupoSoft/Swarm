version: '3.9'

services:
  verifier:
    image: kyrylokupin/email-verifier-node:e9691b251d029260f973f2ed6f0d318a68e92863-proxy-fix
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      MONGO_URL_FILE: /run/secrets/mongo_url
      PROXY_FILE: /run/secrets/proxies_v2
    deploy:
      mode: replicated
      replicas: 4
      placement:
        constraints:
          - node.role == manager
    networks:
      - default
      - mongo_default
    secrets:
      - mongo_url
      - proxies_v2

secrets:
  mongo_url:
    external: true
  proxies_v2:
    external: true

networks:
  default:
  mongo_default:
    external: true
