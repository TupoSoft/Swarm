version: '3.9'

services:
  verifier:
    image: kyrylokupin/email-verifier-node:latest
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - mongo_default

networks:
  mongo_default:
    external: true
