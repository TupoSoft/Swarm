version: '3.9'

services:
  verifier: &verifier
    image: kyrylokupin/email-verifier-node:e9691b251d029260f973f2ed6f0d318a68e92863
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      MONGO_URL_FILE: /run/secrets/mongo_url
    deploy:
      mode: replicated
      replicas: 4
    networks:
      - default
      - mongo_default
    secrets:
      - mongo_url

  verifier_v2:
    <<: *verifier
    image: kyrylokupin/email-verifier-node:26e0448e98fddccce730c4ccd4676b819aa137c0

secrets:
  mongo_url:
    external: true

networks:
  default:
  mongo_default:
    external: true
