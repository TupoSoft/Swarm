version: '3.9'

services:
  primary: &replica
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    healthcheck:
      test: redis-cli --raw incr ping
    volumes:
      - redis-data:/data
    secrets:
      - redis-password
    command: >
        sh -c "redis-server
        --requirepass `cat /run/secrets/redis-password` 
        --masterauth `cat /run/secrets/redis-password`
        --appendonly yes"
    ports:
      - "6379:6379"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-1
      update_config:
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first

  replica_1:
    <<: *replica
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    command: &replica-command >
        sh -c "redis-server
        --replicaof primary 6379
        --requirepass `cat /run/secrets/redis-password` 
        --masterauth `cat /run/secrets/redis-password`
        --appendonly yes"
    ports:
      - "6380:6379"
    deploy:
      placement:
        constraints:
          - node.hostname==manager-2

  replica_2:
    <<: *replica
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    command: *replica-command
    ports:
      - "6381:6379"
    deploy:
      placement:
        constraints:
          - node.hostname==manager-3

  sentinel_1: &sentinel
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    healthcheck:
      test: redis-cli -p 26379 --raw incr ping
    configs:
      - sentinel.conf
    secrets:
      - redis-password
    entrypoint: sh -c
    command:
      - |
        REDIS_PASSWORD=`cat /run/secrets/redis-password`
        cp /sentinel.conf /redis-sentinel.conf
        echo "sentinel auth-pass mymaster $$REDIS_PASSWORD" >> /redis-sentinel.conf
        redis-sentinel /redis-sentinel.conf
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-1
      update_config:
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first

  sentinel_2:
    <<: *sentinel
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-2

  sentinel_3:
    <<: *sentinel
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-3

volumes:
  redis-data:

configs:
  sentinel.conf:
    file: ../configs/redis-sentinel.conf

secrets:
  redis-password:
    external: true
