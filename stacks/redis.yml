version: '3.9'

services:
  primary: &replica
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    healthcheck:
      test: redis-cli --raw incr ping
    volumes:
      - redis-data:/data
    secrets:
      - redis-password
    command: >
        sh -c "redis-server
        --port 6379
        --replica-announce-ip 192.168.2.1
        --replica-announce-port 6379
        --replica-priority 1
        --requirepass `cat /run/secrets/redis-password`
        --masterauth `cat /run/secrets/redis-password`
        --appendonly yes"
    ports:
      - "6379:6379"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-1
      update_config:
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first

  replica_1:
    <<: *replica
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    healthcheck:
      test: redis-cli -p 6380 --raw incr ping
    command: >
        sh -c "redis-server
        --port 6380
        --replica-announce-ip 192.168.2.2
        --replica-announce-port 6380
        --replicaof 192.168.2.1 6379
        --replica-priority 2
        --requirepass `cat /run/secrets/redis-password`
        --masterauth `cat /run/secrets/redis-password`
        --appendonly yes"
    ports:
      - "6380:6380"
    deploy:
      placement:
        constraints:
          - node.hostname==manager-2

  replica_2:
    <<: *replica
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    healthcheck:
      test: redis-cli -p 6381 --raw incr ping
    command: >
      sh -c "redis-server
      --port 6381
      --replica-announce-ip 192.168.2.3
      --replica-announce-port 6381
      --replicaof 192.168.2.1 6379
      --requirepass `cat /run/secrets/redis-password` 
      --masterauth `cat /run/secrets/redis-password`
      --appendonly yes"
    ports:
      - "6381:6381"
    deploy:
      placement:
        constraints:
          - node.hostname==manager-3

  sentinel_1: &sentinel
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    healthcheck:
      test: redis-cli -p $$SENTINEL_PORT ping
    secrets:
      - redis-password
    environment:
      SENTINEL_IP: 192.168.2.1
      SENTINEL_PORT: 5000
    ports:
      - "5000:5000"
    command: >
      sh -c '
        echo "port $$SENTINEL_PORT" >> /etc/sentinel.conf &&
        echo "sentinel announce-ip $$SENTINEL_IP" >> /etc/sentinel.conf &&
        echo "sentinel announce-port $$SENTINEL_PORT" >> /etc/sentinel.conf &&
        echo "sentinel monitor mymaster 192.168.2.1 6379 2" >> /etc/sentinel.conf &&
        echo "sentinel down-after-milliseconds mymaster 5000" >> /etc/sentinel.conf &&
        echo "sentinel failover-timeout mymaster 60000" >> /etc/sentinel.conf &&
        echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
        echo "sentinel auth-pass mymaster `cat /run/secrets/redis-password`" >> /etc/sentinel.conf &&
        redis-sentinel /etc/sentinel.conf
      '
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-1
      update_config:
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first

  sentinel_2:
    <<: *sentinel
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    environment:
      SENTINEL_IP: 192.168.2.2
      SENTINEL_PORT: 5001
    ports:
      - "5001:5001"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-2

  sentinel_3:
    <<: *sentinel
    image: redis@sha256:1bf97f21f01b0e7bd4b7b34a26d3b9d8086e41e70c10f262e8a9e0b49b5116a0
    environment:
      SENTINEL_IP: 192.168.2.3
      SENTINEL_PORT: 5002
    ports:
      - "5002:5002"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-3

volumes:
  redis-data:

secrets:
  redis-password:
    external: true
