version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres:/var/lib/postgresql/data
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728
    secrets:
      - postgres_user
      - postgres_password
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      update_config:
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first

volumes:
  postgres:

secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
