version: '3.8'

services:
  datanode_eu:
    hostname: 'datanode.eu.tuposoft.internal'
    image: graylog/graylog-datanode:6.1.5
    environment:
      GRAYLOG_DATANODE_NODE_ID_FILE: /var/lib/graylog-datanode/node-id
      GRAYLOG_DATANODE_PASSWORD_SECRET__FILE: /run/secrets/graylog_password_secret
      GRAYLOG_DATANODE_ROOT_PASSWORD_SHA2__FILE: /run/secrets/graylog_root_password_sha2
      GRAYLOG_DATANODE_ROOT_USERNAME__FILE: /run/secrets/graylog_root_username
      GRAYLOG_DATANODE_MONGODB_URI__FILE: /run/secrets/graylog_mongodb_uri
    ulimits:
      memlock:
        hard: -1
        soft: -1
      nofile:
        soft: 65536
        hard: 65536
    secrets: &secrets
      - graylog_root_username
      - graylog_root_password_sha2
      - graylog_password_secret
      - graylog_mongodb_uri
    volumes:
      - datanode-data-eu:/var/lib/graylog-datanode
    networks: &networks
      - graylog
      - mongo_default
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first
      placement:
        constraints:
          - node.role == worker

  eu:
    hostname: 'graylog.eu.tuposoft.internal'
    image: graylog/graylog:6.1.5
#    disable the healthcheck for the initial setup
#    healthcheck:
#      disable: true
    environment:
      GRAYLOG_PASSWORD_SECRET__FILE: /run/secrets/graylog_password_secret
      GRAYLOG_ROOT_PASSWORD_SHA2__FILE: /run/secrets/graylog_root_password_sha2
      GRAYLOG_ROOT_USERNAME__FILE: /run/secrets/graylog_root_username
      GRAYLOG_MONGODB_URI__FILE: /run/secrets/graylog_mongodb_uri
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
    ports:
      - "9000:9000"
    volumes:
      - graylog-data-eu:/usr/share/graylog/data/data
      - graylog-journal-eu:/usr/share/graylog/data/journal
    secrets: *secrets
    networks: *networks
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first
      placement:
        constraints:
          - node.role == worker

secrets:
  graylog_root_username:
    external: true
  graylog_root_password_sha2:
    external: true
  graylog_password_secret:
    external: true
  graylog_mongodb_uri:
    external: true

volumes:
  datanode-data-eu:
  graylog-data-eu:
  graylog-journal-eu:

networks:
  graylog:
  mongo_default:
    external: true
