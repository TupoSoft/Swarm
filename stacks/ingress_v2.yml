version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    secrets:
      - p1.leademailfinder.com.cert.pem
      - p1.leademailfinder.com.key.pem
      - tuposoft.com.cert.pem
      - tuposoft.com.key.pem
    configs:
#      - source: api.leademailfinder.com.conf
#        target: /etc/nginx/conf.d/api.leademailfinder.com.conf
      - source: tuposoft.com.conf
        target: /etc/nginx/conf.d/tuposoft.com.conf
      - source: cena.tuposoft.com.conf
        target: /etc/nginx/conf.d/cena.tuposoft.com.conf
    networks:
      - default
      - email_default
      - tuposoftcom_default
      - cena_default
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost/ || exit 1"]
      timeout: 10s
    deploy:
      mode: global
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first

secrets:
  p1.leademailfinder.com.cert.pem:
    external: true
  p1.leademailfinder.com.key.pem:
    external: true
  tuposoft.com.cert.pem:
    external: true
  tuposoft.com.key.pem:
    external: true

configs:
  api.leademailfinder.com.conf:
    name: api.leademailfinder.com.conf-${GITHUB_RUN_ID}
    file: ../configs/nginx/api.leademailfinder.com.conf
  tuposoft.com.conf:
    name: tuposoft.com.conf-${GITHUB_RUN_ID}
    file: ../configs/nginx/tuposoft.com.conf
  cena.tuposoft.com.conf:
    name: cena.tuposoft.com.conf-${GITHUB_RUN_ID}
    file: ../configs/nginx/cena.tuposoft.com.conf

networks:
  default:
  email_default:
    external: true
  tuposoftcom_default:
    external: true
  cena_default:
    external: true
