version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    secrets:
      - p1.leademailfinder.com.cert.pem
      - p1.leademailfinder.com.key.pem
      - tuposoft.com.cert.pem
      - tuposoft.com.key.pem
    configs:
      - source: api.leademailfinder.com.v2.conf
        target: /etc/nginx/conf.d/api.leademailfinder.com.conf
      - source: tuposoft.com.conf
        target: /etc/nginx/conf.d/tuposoft.com.conf
    networks:
      - default
      - email_default
      - tuposoftcom_default
    deploy:
      mode: global
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first

secrets:
  p1.leademailfinder.com.cert.pem:
    external: true
  p1.leademailfinder.com.key.pem:
    external: true
  tuposoft.com.cert.pem:
    external: true
  tuposoft.com.key.pem:
    external: true

configs:
  api.leademailfinder.com.v2.conf:
    file: ../configs/api.leademailfinder.com.v2.conf
  tuposoft.com.conf:
    file: ../configs/tuposoft.com.conf


networks:
  default:
  email_default:
    external: true
  tuposoftcom_default:
    external: true
