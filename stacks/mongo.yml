version: '3.9'

x-config: &config
  mode: 0500
  uid: "999"
  gid: "999"

x-mongo: &mongo
  command: [ "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/run/secrets/keyfile" ]
  environment:
    MONGO_URL_FILE: /run/secrets/mongo_url
    MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
    MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
  healthcheck:
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 5s
    test: mongosh --eval "db.adminCommand('ping')"
  configs:
    - source: rs-initiate.js
      <<: *config
    - source: db-create-user.js
      <<: *config
  secrets:
    - source: mongo_keyfile
      target: keyfile
      mode: 0400
      uid: "999"
      gid: "999"
    - mongo_root_username
    - mongo_root_password
    - mongo_url
  deploy:
    update_config:
      delay: 5s
      failure_action: rollback
      monitor: 15s

services:
  mongo0:
    <<: *mongo
    image: mongo@sha256:7bd28e5eea1c5766a084d5818254046f3ebe3b8f20a65e3a274640189e296667
    volumes:
      - mongo0-data:/data/db
      - mongo0-config:/data/configdb
    ports:
      - "27017:27017"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-1

  mongo1:
    <<: *mongo
    image: mongo@sha256:7bd28e5eea1c5766a084d5818254046f3ebe3b8f20a65e3a274640189e296667
    volumes:
      - mongo1-data:/data/db
      - mongo1-config:/data/configdb
    ports:
      - "27018:27017"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-2

  mongo2:
    <<: *mongo
    image: mongo@sha256:7bd28e5eea1c5766a084d5818254046f3ebe3b8f20a65e3a274640189e296667
    ports:
      - "27019:27017"
    volumes:
      - mongo2-data:/data/db
      - mongo2-config:/data/configdb
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==manager-3

  mgob:
    image: maxisam/mgob:2.0.27-minio
    entrypoint: sh
    command:
      - -c
      - |
        export MONGO_BACKUP__TARGET_URI=`cat /run/secrets/mongo_url`
        /usr/local/bin/mgob
    secrets:
      - source: mgob_mongo_backup
        target: /config/mongo_backup.yml
      - mongo_url

configs:
  rs-initiate.js:
    file: ../configs/rs-initiate.js
  db-create-user.js:
    file: ../configs/db-create-user.js

secrets:
  mongo_keyfile:
    external: true
  mongo_root_username:
    external: true
  mongo_root_password:
    external: true
  mongo_url:
    external: true
  mgob_mongo_backup:
    external: true

volumes:
  mongo0-data:
  mongo1-data:
  mongo2-data:
  mongo0-config:
  mongo1-config:
  mongo2-config:
