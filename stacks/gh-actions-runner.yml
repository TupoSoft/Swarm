version: "3.8"

services:
  actions-runner:
    image: ghcr.io/tuposoft/gh-actions-runner:latest
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      placement:
        preferences:
          - spread: node.hostname
    secrets:
      - gh_pat
    configs:
      - source: runner_entrypoint
        target: /entrypoint.sh
        mode: 0755
    environment:
      RUNNER_ORG: "TupoSoft"
      RUNNER_LABELS: "swarm,ubuntu-22"
      GH_PAT_SECRET_FILE_PATH: "/run/secrets/gh_pat"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_work:/actions-runner/_work

secrets:
  gh_pat:
    name: gh_pat_19062025
    external: true

configs:
  runner_entrypoint:
    name: github_actions_runner_entrypoint_${GITHUB_RUN_ID}.sh
    file: ../gh-actions-runner/entrypoint.sh

volumes:
  runner_work:
