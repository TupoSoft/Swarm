name: Build and Push Images

on:
  push:
    branches:
      - master
    paths:
      - gh-actions-runner/Dockerfile
  workflow_dispatch:

jobs:
  build-push:
    uses: TupoSoft/GitHubActions/.github/workflows/build-push.yml@master
    permissions:
      packages: write
      contents: read
    secrets: inherit
    with:
      image-name: gh-actions-runner
      dockerfile: gh-actions-runner/Dockerfile
      build-args: |
        RUNNER_VERSION="2.325.0"
