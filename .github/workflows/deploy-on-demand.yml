name: Deploy Stacks on Demand

on:
  workflow_dispatch:
    inputs:
      stacks:
        type: string
        description: Comma-separated list of stacks to deploy (e.g., stack1,stack2,stack3)
        required: true

concurrency:
  group: deploy-stacks-${{ github.repository }}

jobs:
  parse-stack-list:
    name: Prepare Stack Set for Matrix
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.parse.outputs.stacks }}
    steps:
      - name: Convert comma-separated input to JSON array
        id: parse
        shell: sh
        run: |
          stacks=`echo -n "${{ inputs.stacks }}" | jq -Rsc 'split(",") | map(gsub("^[ \t]+|[ \t]+$"; ""))'`
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  deploy-stack:
    needs: parse-stack-list
    name: Deploy Stack
    strategy:
      matrix:
        stack: ${{ fromJSON(needs.parse-stack-list.outputs.stacks) }}
      fail-fast: false
    uses: TupoSoft/GitHubActions/.github/workflows/swarm-deploy.yml@master
    with:
      stack_name: ${{ matrix.stack }}
      stack_file: stacks/${{ matrix.stack }}.yml
    secrets: inherit
    concurrency:
      group: deploy-stack-${{ matrix.stack }}
