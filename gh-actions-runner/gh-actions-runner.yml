version: "3.8"

services:
  actions-runner:
    image: ghcr.io/tuposoft/gh-actions-runner:self-hosted-ci
    deploy:
      # Each launcher runs one isolated job; two replicas allow concurrent jobs.
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          # Reserve a scheduling budget; each pair can use up to four CPUs.
          cpus: "3.0"
          memory: 8G
      placement:
        constraints:
          - node.platform.os == linux
          - node.platform.arch == x86_64
          - node.labels.ci_optional != true
        preferences:
          - spread: node.hostname
    stop_grace_period: 2m
    secrets:
      - gh_pat
    environment:
      RUNNER_ORG: TupoSoft
      RUNNER_LABELS: swarm,ubuntu-22,docker-isolated
      GH_PAT_SECRET_FILE_PATH: /run/secrets/gh_pat
      DIND_IMAGE: docker:29.6.1-dind
      RUNNER_CPUS: "2"
      RUNNER_MEMORY: 4g
      DIND_CPUS: "2"
      DIND_MEMORY: 4g
      RUNNER_SHM_SIZE: 1g
    volumes:
      # Used only by the launcher. Neither job container receives this mount.
      - /var/run/docker.sock:/var/run/docker.sock

  actions-runner-optional:
    image: ghcr.io/tuposoft/gh-actions-runner:self-hosted-ci
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          cpus: "4.0"
          memory: 8G
      placement:
        constraints:
          - node.platform.os == linux
          - node.platform.arch == x86_64
          - node.labels.ci_optional == true
    stop_grace_period: 2m
    secrets:
      - gh_pat
    environment:
      RUNNER_ORG: TupoSoft
      RUNNER_LABELS: swarm,ubuntu-22,docker-isolated,personal-pc
      GH_PAT_SECRET_FILE_PATH: /run/secrets/gh_pat
      DIND_IMAGE: docker:29.6.1-dind
      RUNNER_CPUS: "2"
      RUNNER_MEMORY: 4g
      DIND_CPUS: "2"
      DIND_MEMORY: 4g
      RUNNER_SHM_SIZE: 1g
    volumes:
      # Used only by the launcher. Neither job container receives this mount.
      - /var/run/docker.sock:/var/run/docker.sock

secrets:
  gh_pat:
    name: gh_pat_20260912
    external: true
