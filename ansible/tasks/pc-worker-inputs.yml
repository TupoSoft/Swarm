---
- name: Require the worker VPN settings
  ansible.builtin.assert:
    that:
      - pc_worker_address is defined
      - pc_worker_vpn_cidr is defined
      - pc_worker_manager_public_key is defined
      - pc_worker_manager_endpoint is defined
    fail_msg: Copy worker.example.yml to worker.local.yml and supply all four VPN settings.

- name: Validate the public VPN settings before changing the guest
  ansible.builtin.assert:
    that:
      - pc_worker_address is string
      - pc_worker_vpn_cidr is string
      - pc_worker_manager_public_key is string
      - pc_worker_manager_endpoint is string
      - pc_worker_address is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/32\Z')
      - pc_worker_vpn_cidr is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}\Z')
      - pc_worker_manager_public_key is match('^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=\Z')
      - pc_worker_manager_endpoint is match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.?:[0-9]{1,5}\Z')
      - pc_worker_manager_endpoint.split(':')[0] | length <= 253
    fail_msg: Supply an IPv4 worker /32, IPv4 VPN CIDR, WireGuard public key, and hostname-or-IPv4 endpoint with a port.

- name: Validate IPv4 octets and the VPN port
  ansible.builtin.assert:
    that:
      - pc_worker_address.split('/')[0].split('.') | map('int') | max <= 255
      - pc_worker_vpn_cidr.split('/')[0].split('.') | map('int') | max <= 255
      - pc_worker_vpn_cidr.split('/')[1] | int <= 32
      - pc_worker_manager_endpoint.split(':')[1] | int >= 1
      - pc_worker_manager_endpoint.split(':')[1] | int <= 65535
    fail_msg: IPv4 octets must be 0-255, the VPN prefix 0-32, and the endpoint port 1-65535.

- name: Validate an IPv4 endpoint without interpreting it as a hostname
  ansible.builtin.assert:
    that:
      - pc_worker_manager_endpoint.split(':')[0] is match('^(0|[1-9][0-9]{0,2})(\.(0|[1-9][0-9]{0,2})){3}\Z')
      - pc_worker_manager_endpoint.split(':')[0].split('.') | map('int') | max <= 255
    fail_msg: An IPv4 endpoint must contain four decimal octets from 0 to 255 without leading zeros.
  when: pc_worker_manager_endpoint.split(':')[0] is match('^[0-9.]+\Z')
