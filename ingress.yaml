version: '3.9'

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    secrets:
      - p1.leademailfinder.com.cert.pem
      - p1.leademailfinder.com.key.pem
      - tuposoft.com.cert.pem
      - tuposoft.com.key.pem
    configs:
      - source: p0.leademailfinder.com.conf
        target: /etc/nginx/conf.d/p0.leademailfinder.com.conf
      - source: tuposoft.com.conf
        target: /etc/nginx/conf.d/tuposoft.com.conf
    networks:
      - default
      - verifier_v2_default
      - email_default
      - tuposoftcom_default
    deploy:
      mode: global

secrets:
  p1.leademailfinder.com.cert.pem:
    external: true
  p1.leademailfinder.com.key.pem:
    external: true
  tuposoft.com.cert.pem:
    external: true
  tuposoft.com.key.pem:
    external: true

configs:
  p0.leademailfinder.com.conf:
    file: configs/p0.leademailfinder.com.conf
  tuposoft.com.conf:
    file: configs/tuposoft.com.conf


networks:
  default:
  verifier_v2_default:
    external: true
  email_default:
    external: true
  tuposoftcom_default:
    external: true
