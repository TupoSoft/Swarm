version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    restart: unless-stopped
    secrets:
      - p1.leademailfinder.com.cert.pem
      - p1.leademailfinder.com.key.pem
    configs:
      - source: p0.leademailfinder.com.conf
        target: /etc/nginx/conf.d/p0.leademailfinder.com.conf
      - source: p1.leademailfinder.com.conf
        target: /etc/nginx/conf.d/p1.leademailfinder.com.conf
    networks:
      - default
      - verifier_v2_default
    deploy:
      mode: global

secrets:
  p1.leademailfinder.com.cert.pem:
    external: true
  p1.leademailfinder.com.key.pem:
    external: true

configs:
  p0.leademailfinder.com.conf:
    file: configs/p0.leademailfinder.com.conf
  p1.leademailfinder.com.conf:
    file: configs/p1.leademailfinder.com.conf

networks:
  default:
  verifier_v2_default:
    external: true
