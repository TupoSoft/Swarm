# Auth
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm Proxy Authentication

# ACL
acl authenticated_users proxy_auth REQUIRED
acl safe_ports port 25      # SMTP
acl safe_ports port 80      # HTTP
acl safe_ports port 443     # HTTPS

acl CONNECT method CONNECT

# Anonimity
header_access X-Forwarded-For deny all
header_access Via deny all
header_access Cache-Control deny all
header_access Server deny all
header_access From deny all
header_access Client-IP deny all

# HTTP access
http_access allow authenticated_users
http_access deny all
http_port 3128
https_port 3129 tls-cert=/etc/letsencrypt/live/leademailfinder.com/fullchain.pem tls-key=/etc/letsencrypt/live/leademailfinder.com/privkey.pem

acl ip1 localip 192.236.146.136
tcp_outgoing_address 192.236.146.136 ip1

acl ip2 localip 23.254.226.185
tcp_outgoing_address 23.254.226.185 ip2

acl ip3 localip 23.254.225.232
tcp_outgoing_address 23.254.225.232 ip3

max_filedescriptors 65536
